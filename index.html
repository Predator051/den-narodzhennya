<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Привітання з днем народження · Платформа</title>
<meta name="description" content="Сторіс-привітання з днем народження для @platforma.youth: фото, ім'я, готовий PNG.">
<meta name="theme-color" content="#172332">
<meta name="robots" content="noindex">
<link rel="icon" href="mark-white.png">
<link rel="preload" href="fonts/FiraSansExtraCondensed-Black.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/Onest-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:Onest;font-weight:500;font-display:block;src:url(fonts/Onest-Medium.ttf) format("truetype")}
@font-face{font-family:Onest;font-weight:600;font-display:block;src:url(fonts/Onest-SemiBold.ttf) format("truetype")}
@font-face{font-family:"Fira Sans Extra Condensed";font-weight:900;font-display:block;src:url(fonts/FiraSansExtraCondensed-Black.ttf) format("truetype")}
:root{
  --jet:#172332;--jet-2:#1E2C3F;--jet-3:#26374D;
  --alice:#EEF8FF;--gold:#F9DC5C;--wis:#8297BF;
  --line:rgba(130,151,191,.32);--muted:#9FB0CF;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{background:var(--jet);-webkit-text-size-adjust:100%}
body{min-height:100svh;background:var(--jet);color:var(--alice);font:500 16px/1.45 Onest,system-ui,sans-serif;caret-color:var(--gold)}
::selection{background:var(--gold);color:var(--jet)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.app{display:grid;gap:20px;padding:16px 16px 0;max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px}
.top img{width:36px;height:36px}
.top h1{font-weight:600;font-size:18px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}

.stage{display:grid;justify-items:center;gap:10px}
.canvas-wrap{position:relative;width:min(100%,calc(64svh * 9 / 16));aspect-ratio:9/16;border-radius:18px;overflow:hidden;
  box-shadow:0 18px 50px rgba(5,10,18,.55),0 2px 6px rgba(5,10,18,.4);background:var(--jet-2)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
.status{min-height:1.45em;font-size:14px;color:var(--muted);text-align:center}
.status.warn{color:var(--gold)}

.panel{display:grid;gap:22px;padding-bottom:8px}
.field{display:grid;gap:8px;border:0;padding:0;min-width:0}
.label{font-weight:600;font-size:15px;color:var(--alice)}
.hint{font-size:13.5px;color:var(--muted)}
input[type=text],textarea{width:100%;background:var(--jet-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:16px;transition:border-color .2s}
input[type=text]:hover,textarea:hover{border-color:rgba(130,151,191,.55)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--gold)}
input::placeholder,textarea::placeholder{color:#93A4C3}
#name{font-size:20px;font-weight:600}
textarea{resize:vertical;min-height:110px;line-height:1.4}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 20px;border-radius:var(--r);font-weight:600;font-size:16px;border:1px solid transparent;transition:background .2s,border-color .2s,opacity .2s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn svg{width:20px;height:20px;flex:none}
.btn.ghost{background:var(--jet-2);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--wis);background:var(--jet-3)}
.btn.primary{width:100%;background:var(--gold);color:var(--jet);font-size:17px}
.btn.primary:hover{background:#FBE47F}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.link{justify-self:start;background:none;border:0;padding:4px 0;color:var(--gold);font-weight:600;font-size:14.5px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.link:disabled{color:var(--muted);text-decoration:none;cursor:not-allowed}

input[type=range]{width:100%;accent-color:var(--gold);height:28px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.check{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--jet-2);cursor:pointer;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--jet-2)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:flex;align-items:center;min-height:44px;padding:0 18px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg input:checked+span{background:var(--gold);color:var(--jet)}
.seg input:focus-visible+span{outline:2px solid var(--gold);outline-offset:-4px}

.nudge-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,40px);gap:4px}
.arr{display:grid;place-items:center;background:var(--jet-2);border:1px solid var(--line);border-radius:10px;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .15s,border-color .15s}
.arr:hover:not(:disabled){border-color:var(--wis);background:var(--jet-3)}
.arr:active:not(:disabled){background:var(--gold);border-color:var(--gold);color:var(--jet)}
.arr:disabled{opacity:.35;cursor:not-allowed}
.arr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.arr.up{grid-area:1/2}.arr.left{grid-area:2/1}.arr.right{grid-area:2/3}.arr.down{grid-area:3/2}
.seg input:disabled+span{cursor:not-allowed}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.swatches label{position:relative;display:grid;justify-items:center;gap:6px;cursor:pointer}
.swatches input{position:absolute;opacity:0;inset:0;cursor:pointer}
.swatches span{width:46px;height:46px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(238,248,255,.25);transition:box-shadow .15s}
.swatches input:checked+span{box-shadow:inset 0 0 0 1px rgba(238,248,255,.25),0 0 0 3px var(--jet),0 0 0 5px var(--gold)}
.swatches input:focus-visible+span{outline:2px solid var(--gold);outline-offset:6px}
.swatches em{font-style:normal;font-size:13px;color:var(--muted)}
.swatches input:checked~em{color:var(--alice);font-weight:600}
details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--wis);border-bottom:2px solid var(--wis);transform:rotate(45deg) translateY(-2px);margin-left:2px;transition:transform .2s}
details[open] summary::after{transform:rotate(225deg) translateY(-2px)}
summary small{font-weight:500;color:var(--muted);font-size:13.5px}
details[open]>:not(summary){margin-top:12px}
details .stack{display:grid;gap:10px}

.save{position:sticky;bottom:0;display:grid;gap:6px;padding:14px 0 calc(14px + env(safe-area-inset-bottom));margin-top:-6px;
  background:linear-gradient(180deg,rgba(23,35,50,0),var(--jet) 22px)}
.save .hint{text-align:center}

@media (min-width:880px){
  .app{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto 1fr;column-gap:48px;padding:28px 32px 0}
  .top{grid-column:1/-1}
  .stage{position:sticky;top:20px;align-self:start}
  .canvas-wrap{width:auto;height:calc(100svh - 130px);max-height:1000px}
  .panel{padding-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <img src="mark-white.png" alt="Платформа" width="36" height="36">
    <h1>Привітання з днем народження</h1>
  </header>

  <section class="stage" aria-label="Попередній перегляд">
    <div class="canvas-wrap"><canvas id="story" width="1080" height="1920" role="img" aria-label="Сторіс-привітання, попередній перегляд"></canvas></div>
    <p class="status" id="status" role="status"></p>
  </section>

  <form class="panel" id="panel" autocomplete="off" onsubmit="return false">
    <div class="field">
      <span class="label">Фото</span>
      <div class="row">
        <button type="button" class="btn ghost" id="pick">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 9"/></svg>
          <span id="pickText">Обрати фото</span>
        </button>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <label class="field">
      <span class="label">Ім'я</span>
      <input type="text" id="name" placeholder="Петра" maxlength="22" enterkeyhint="done" spellcheck="false">
      <span class="hint">Пиши так, як воно звучить після «Платформа вітає»: Петра, Анастасію, Даню.</span>
    </label>

    <div class="field">
      <span class="label">Кадр</span>
      <input type="range" id="zoom" min="1" max="4" step="0.01" value="1" aria-label="Масштаб фото" disabled>
      <span class="hint">Фото, корону й ім'я можна тягнути пальцем або мишкою, а точно підправити стрілками.</span>
      <div class="nudge-row">
        <div class="seg" role="radiogroup" aria-label="Що рухати стрілками">
          <label><input type="radio" name="target" value="photo" checked disabled><span>Фото</span></label>
          <label><input type="radio" name="target" value="crown" disabled><span>Корону</span></label>
          <label><input type="radio" name="target" value="name" disabled><span>Ім'я</span></label>
        </div>
        <div class="pad" role="group" aria-label="Зсунути">
          <button type="button" class="arr up" data-nudge="0,-1" aria-label="Вгору" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
          <button type="button" class="arr left" data-nudge="-1,0" aria-label="Вліво" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button type="button" class="arr right" data-nudge="1,0" aria-label="Вправо" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <button type="button" class="arr down" data-nudge="0,1" aria-label="Вниз" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
      </div>
      <button type="button" class="link" id="refit" disabled>Поставити кадр по обличчю</button>
    </div>

    <fieldset class="field">
      <legend class="label">Колір тла</legend>
      <div class="swatches" role="radiogroup" aria-label="Колір тла">
        <label title="Темно-синій"><input type="radio" name="bg" value="jet" checked><span style="--c:#172332"></span><em>Темний</em></label>
        <label title="Бордовий"><input type="radio" name="bg" value="oxblood"><span style="--c:#96130D"></span><em>Бордо</em></label>
        <label title="Лавандовий"><input type="radio" name="bg" value="wisteria"><span style="--c:#8297BF"></span><em>Лаванда</em></label>
        <label title="Золотий"><input type="radio" name="bg" value="gold"><span style="--c:#F9DC5C"></span><em>Золото</em></label>
        <label title="Світлий"><input type="radio" name="bg" value="alice"><span style="--c:#EEF8FF"></span><em>Світлий</em></label>
      </div>
    </fieldset>

    <fieldset class="field">
      <legend class="label">Прикраси</legend>
      <div class="row" style="margin-top:8px">
        <label class="check"><input type="checkbox" id="crown" checked> Корона</label>
        <div class="seg" role="radiogroup" aria-label="Малюнок унизу">
          <label><input type="radio" name="item" value="cake" checked><span>Торт</span></label>
          <label><input type="radio" name="item" value="gift"><span>Подарунок</span></label>
        </div>
      </div>
    </fieldset>

    <details>
      <summary>Вірш <small id="refPreview"></small></summary>
      <div class="stack">
        <textarea id="verse" rows="4" aria-label="Текст вірша"></textarea>
        <input type="text" id="ref" aria-label="Звідки вірш" placeholder="Псалом 121:7–8">
        <span class="hint">Залиш вірш порожнім, і на картинці його не буде.</span>
      </div>
    </details>

    <div class="save">
      <button type="button" class="btn primary" id="save" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        <span>Зберегти картинку</span>
      </button>
      <span class="hint" id="saveHint">Спершу додай фото й ім'я</span>
    </div>
  </form>
</main>
<script type="module" src="app.js?v=5"></script>
</body>
</html>
